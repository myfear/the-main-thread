# LocalStack Dev Services wires S3/SQS/SSM endpoints reliably in @QuarkusTest (Floci + fixed port alone does not)
quarkus.aws.devservices.provider=localstack
quarkus.aws.devservices.floci.enabled=false

quarkus.s3.aws.region=us-east-1
quarkus.sqs.aws.region=us-east-1
quarkus.ssm.aws.region=us-east-1

quarkus.s3.path-style-access=true

quarkus.ssm.config.enabled=false
