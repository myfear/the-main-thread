quarkus.application.name=agent-studio-runtime
quarkus.http.host=127.0.0.1
quarkus.http.port=8126
quarkus.jackson.fail-on-unknown-properties=true
quarkus.http.limits.max-body-size=64K

quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=docker.io/library/postgres:17.7
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=studio
quarkus.flyway.default-schema=studio

# Separate migration history; Flow's entities still use the default datasource.
quarkus.datasource.flow-runtime.db-kind=postgresql
quarkus.datasource.flow-runtime.devservices.enabled=false
quarkus.datasource.flow-runtime.jdbc.url=${quarkus.datasource.jdbc.url}
quarkus.datasource.flow-runtime.username=${quarkus.datasource.username}
quarkus.datasource.flow-runtime.password=${quarkus.datasource.password}
quarkus.flyway.flow-runtime.table=flyway_flow_runtime_history
quarkus.flyway.flow-runtime.locations=db/flow-migration/runtime/postgresql
quarkus.flyway.flow-runtime.migrate-at-start=true

quarkus.flow.runner.source.path=${STUDIO_WORKFLOW_DIRECTORY:workflows/published}
quarkus.flow.runner.source.watch.enabled=true
quarkus.flow.runner.source.watch.interval=1s
quarkus.flow.runner.security.type=API_KEY
quarkus.flow.runner.security.api-keys.studio.secret=${STUDIO_RUNNER_TOKEN}
quarkus.flow.runner.security.api-keys.studio.roles=flow-admin,flow-invoker,flow-viewer
quarkus.flow.http.client.static-headers=X-Studio-Internal-Token=${STUDIO_INTERNAL_TOKEN}
quarkus.flow.http.client.follow-redirects=false
quarkus.flow.http.client.connect-timeout=2000
quarkus.flow.http.client.read-timeout=5000
quarkus.flow.tracing.enabled=false
quarkus.flow.structured-logging.include-task-payloads=false
quarkus.flow.structured-logging.include-workflow-payloads=false

# Public local-demo credentials. Production has no defaults.
%dev.STUDIO_INTERNAL_TOKEN=local-spike-executor
%dev.STUDIO_RUNNER_TOKEN=local-spike-runner
%test.STUDIO_INTERNAL_TOKEN=test-spike-executor
%test.STUDIO_RUNNER_TOKEN=test-spike-runner
studio.internal-token=${STUDIO_INTERNAL_TOKEN}
studio.runner-token=${STUDIO_RUNNER_TOKEN}
studio.executor-base-url=http://127.0.0.1:${quarkus.http.port}
