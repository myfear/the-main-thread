quarkus.http.host=127.0.0.1
quarkus.http.port=8096
quarkus.http.limits.max-body-size=32K
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=pgvector/pgvector:0.8.2-pg17
quarkus.datasource.devservices.reuse=false
%dev.quarkus.datasource.devservices.volumes."./.data/postgres"=/var/lib/postgresql/data
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.sql-load-script=no-file
quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.langchain4j.ollama.devservices.enabled=false
quarkus.langchain4j.ollama.base-url=http://127.0.0.1:11434
quarkus.langchain4j.ollama.chat-model.model-id=qwen3:8b
quarkus.langchain4j.ollama.chat-model.temperature=0
quarkus.langchain4j.ollama.chat-model.model-options.think=false
quarkus.langchain4j.ollama.embedding-model.model-id=nomic-embed-text
quarkus.langchain4j.ollama.timeout=180s
quarkus.langchain4j.ollama.log-requests=false
quarkus.langchain4j.ollama.log-responses=false
%test.office.memory.verify-embedding-on-start=false
%test.quarkus.langchain4j.ollama.base-url=http://127.0.0.1:1
