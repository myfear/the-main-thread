quarkus.http.host=127.0.0.1
quarkus.http.limits.max-body-size=16K
quarkus.langchain4j.ollama.base-url=${OLLAMA_URL:http://127.0.0.1:11434}
quarkus.langchain4j.ollama.chat-model.model-id=qwen2.5:7b
quarkus.langchain4j.ollama.chat-model.temperature=0.2
quarkus.langchain4j.ollama.chat-model.num-predict=320
quarkus.langchain4j.ollama.chat-model.model-options.num-ctx=4096
quarkus.langchain4j.ollama.timeout=90s

images.model=flux3-image-klein
images.output-directory=${IMAGE_OUTPUT_DIR:data/images}
images.command=${MFLUX_BIN:mflux-generate-flux3}
images.timeout=5m
