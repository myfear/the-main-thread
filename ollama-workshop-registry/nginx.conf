worker_processes auto;
events { worker_connections 4096; }
http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    server {
        listen 8080;
        server_name _;
        location /v2/ {
            # Ollama downloads with GET and HEAD, including byte-range requests.
            limit_except GET HEAD { deny all; }
            # The containers share the Quadlet pod's network namespace.
            proxy_pass http://127.0.0.1:5000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            # Ollama 0.40.x expects Location even on a 200 blob response.
            # A relative self-reference resolves against the public endpoint
            # (including HTTPS) and also works for subsequent Range requests.
            add_header Location $request_uri;
            proxy_buffering off;
            proxy_read_timeout 900s;
            send_timeout 900s;
        }
        location / { return 404; }
    }
    server {
        listen 8082;
        server_name _;
        location /central/ {
            limit_except GET HEAD { deny all; }
            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_read_timeout 180s;
        }
        location / { return 404; }
    }
}
