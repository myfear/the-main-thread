quarkus.kafka-streams.application-id=order-context-v1
quarkus.kafka-streams.topics=order-placed,inventory-status,shipping-status,source-heartbeats
kafka-streams.auto.offset.reset=earliest
context.heartbeat-max-age=30s
context.heartbeat-future-skew=5s

# Isolated disposable Kafka brokers in dev/test; no fixed bootstrap port.
%dev,test.quarkus.kafka.devservices.shared=false
%dev,test.quarkus.kafka.devservices.topic-partitions.order-placed=1
%dev,test.quarkus.kafka.devservices.topic-partitions.inventory-status=1
%dev,test.quarkus.kafka.devservices.topic-partitions.shipping-status=1
%dev,test.quarkus.kafka.devservices.topic-partitions.source-heartbeats=1
%dev.kafka-streams.state.dir=target/kafka-streams-dev
%test.kafka-streams.state.dir=target/kafka-streams-test

# No publishing channels or publisher beans in test/prod builds.
%dev.mp.messaging.connector.smallrye-kafka.key.serializer=org.apache.kafka.common.serialization.StringSerializer
%dev.mp.messaging.connector.smallrye-kafka.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
%dev.mp.messaging.connector.smallrye-kafka.acks=all
%dev.mp.messaging.connector.smallrye-kafka.delivery.timeout.ms=10000
%dev.mp.messaging.connector.smallrye-kafka.request.timeout.ms=5000
%dev.mp.messaging.connector.smallrye-kafka.max.block.ms=10000
%dev.mp.messaging.outgoing.order-placed.connector=smallrye-kafka
%dev.mp.messaging.outgoing.inventory-status.connector=smallrye-kafka
%dev.mp.messaging.outgoing.shipping-status.connector=smallrye-kafka
%dev.mp.messaging.outgoing.source-heartbeats.connector=smallrye-kafka
