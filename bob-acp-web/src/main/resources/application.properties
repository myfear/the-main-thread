bob.binary=${BOB_PATH:bob}
bob.arguments=${BOB_ARGUMENTS:acp,--trust,--accept-license,--disable-mcp,--disable-subagents}
bob.workspace-root=${BOB_WORKSPACE_ROOT:${user.dir}}
bob.request-timeout=30s
bob.prompt-timeout=10m
bob.permission-timeout=2m
bob.max-conversations=4

quarkus.http.host=127.0.0.1
quarkus.http.limits.max-body-size=64K

%test.bob.binary=unused-in-tests
%test.bob.workspace-root=${java.io.tmpdir}
