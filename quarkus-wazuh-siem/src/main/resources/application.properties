quarkus.application.name=quarkus-siem-demo
# Brings in the Compose deployment infrastructure; no LGTM stack is started.
quarkus.observability.enabled=false
quarkus.http.host=127.0.0.1
%dev.quarkus.http.port=8088
quarkus.http.proxy.proxy-address-forwarding=false

# Fake accounts exist only in development and test profiles.
%dev.quarkus.http.auth.basic=true
%test.quarkus.http.auth.basic=true
%dev.quarkus.security.users.embedded.enabled=true
%test.quarkus.security.users.embedded.enabled=true
%dev.quarkus.security.users.embedded.plain-text=true
%test.quarkus.security.users.embedded.plain-text=true
%dev.quarkus.security.users.embedded.users.alice=alice-dev-only
%test.quarkus.security.users.embedded.users.alice=alice-dev-only
%dev.quarkus.security.users.embedded.roles.alice=user
%test.quarkus.security.users.embedded.roles.alice=user
%dev.quarkus.security.users.embedded.users.operator=operator-dev-only
%test.quarkus.security.users.embedded.users.operator=operator-dev-only
%dev.quarkus.security.users.embedded.roles.operator=user,admin
%test.quarkus.security.users.embedded.roles.operator=user,admin

quarkus.log.handler.file.audit.enabled=true
quarkus.log.handler.file.audit.path=target/siem/security-events.jsonl
%test.quarkus.log.handler.file.audit.path=target/test-siem/security-events.jsonl
%prod.quarkus.log.handler.file.audit.path=target/prod-siem/security-events.jsonl
quarkus.log.handler.file.audit.format=%s%n
quarkus.log.handler.file.audit.rotation.max-file-size=10M
quarkus.log.handler.file.audit.rotation.max-backup-index=3
quarkus.log.handler.file.audit.rotation.rotate-on-boot=false
quarkus.log.category."com.example.siem.audit".level=INFO
quarkus.log.category."com.example.siem.audit".handlers=audit
quarkus.log.category."com.example.siem.audit".use-parent-handlers=false

%dev.quarkus.compose.devservices.enabled=${WAZUH_COMPOSE_ENABLED:true}
%dev.quarkus.compose.devservices.files=infra/wazuh/compose.yml
%dev.quarkus.compose.devservices.project-name=quarkus-wazuh-siem
%dev.quarkus.compose.devservices.startup-timeout=5m
%dev.quarkus.compose.devservices.stop-timeout=30s
%dev.quarkus.compose.devservices.remove-volumes=false
%dev.quarkus.compose.devservices.ryuk-enabled=false
%dev.quarkus.compose.devservices.env-variables.PODMAN_COMPOSE_PROVIDER=${PODMAN_COMPOSE_PROVIDER:docker-compose}
%test.quarkus.compose.devservices.enabled=false
