quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.max-size=2
quarkus.datasource.jdbc.acquisition-timeout=1s
quarkus.datasource.jdbc.additional-jdbc-properties.socketTimeout=5
quarkus.datasource.jdbc.additional-jdbc-properties.connectTimeout=5
quarkus.datasource.jdbc.background-validation-interval=0
quarkus.datasource.jdbc.foreground-validation-interval=0
quarkus.datasource.jdbc.metrics.enabled=true

%dev.quarkus.http.port=8097
quarkus.http.test-port=0
%dev.quarkus.network-faults.enabled=true
%dev.quarkus.datasource.devservices.image-name=docker.io/library/postgres:18
%test.quarkus.datasource.devservices.image-name=docker.io/library/postgres:18
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.sql-load-script=no-file

# Optional second run: validate a pooled connection before handing it out.
%validated.quarkus.datasource.jdbc.foreground-validation-interval=PT0.001S
