quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.transaction-isolation-level=read-committed
quarkus.datasource.jdbc.max-size=8
quarkus.datasource.devservices.image-name=docker.io/library/postgres:17.7
quarkus.datasource.devservices.reuse=false
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.sql-load-script=no-file
quarkus.http.host=127.0.0.1

%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%dev.gift.demo.enabled=true
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.gift.demo.enabled=true
%test.gift.demo.wait-timeout=2s

# Explicit profile for HTTP tests of the packaged JAR against Dev Services.
%it.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%it.gift.demo.enabled=true
%it.gift.demo.wait-timeout=2s
