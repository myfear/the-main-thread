quarkus.langchain4j.ollama.base-url=http://localhost:11434
quarkus.langchain4j.ollama.chat-model.model-name=gpt-oss:20b
quarkus.langchain4j.ollama.chat-model.temperature=0
quarkus.langchain4j.ollama.embedding-model.model-name=granite-embedding:30m
quarkus.langchain4j.ollama.timeout=5m

# Dedicated demo table. DocumentLoader replaces its contents on every startup.
quarkus.langchain4j.pgvector.table=rag_demo_embeddings
quarkus.langchain4j.pgvector.dimension=${rag.embedding-dimension}
quarkus.langchain4j.pgvector.create-table=true
quarkus.langchain4j.pgvector.drop-table-first=false
quarkus.langchain4j.pgvector.use-index=false
quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.devservices.image-name=pgvector/pgvector:pg17
%test.quarkus.datasource.devservices.image-name=pgvector/pgvector:pg17

quarkus.docling.connect-timeout=10s
quarkus.docling.read-timeout=1m
quarkus.docling.async-poll-interval=2s
quarkus.docling.async-timeout=5m
quarkus.docling.devservices.image=ghcr.io/docling-project/docling-serve-cpu:v1.35.0
quarkus.docling.devservices.enable-ui=false
quarkus.docling.devservices.startup-timeout=5m

rag.documents-directory=documents
rag.converted-directory=converted
rag.chunk-characters=600
rag.overlap-characters=80
rag.embedding-dimension=384
rag.minimum-score=0.6
