name: tmt-checkout-cdc
services:
  postgres:
    image: docker.io/library/postgres:18.4-alpine3.24
    environment:
      POSTGRES_DB: checkout
      POSTGRES_USER: checkout
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env}
      CDC_PASSWORD: ${CDC_PASSWORD:?Set CDC_PASSWORD}
    command: [postgres, -c, wal_level=logical, -c, max_replication_slots=4, -c, max_wal_senders=4, -c, max_slot_wal_keep_size=256MB]
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-25432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U checkout -d checkout']
      interval: 2s
      timeout: 3s
      retries: 60
  kafka:
    image: docker.io/apache/kafka:4.3.1
    ports:
      - '127.0.0.1:${KAFKA_PORT:-29092}:29092'
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null']
      interval: 5s
      timeout: 10s
      retries: 30
  connect:
    image: quay.io/debezium/connect:3.7.0.Final
    ports:
      - '127.0.0.1:${CONNECT_PORT:-28083}:8083'
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: checkout-cdc
      CONFIG_STORAGE_TOPIC: checkout-connect-configs
      OFFSET_STORAGE_TOPIC: checkout-connect-offsets
      STATUS_STORAGE_TOPIC: checkout-connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_PARTITIONS: 1
      STATUS_STORAGE_PARTITIONS: 1
      REST_ADVERTISED_HOST_NAME: connect
    depends_on:
      - postgres
      - kafka
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:8083/connectors >/dev/null']
      interval: 5s
      timeout: 3s
      retries: 60
volumes:
  postgres-data:
  kafka-data:
