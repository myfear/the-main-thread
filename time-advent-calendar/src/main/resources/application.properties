quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=postgres:18
quarkus.flyway.migrate-at-start=true
quarkus.http.host=127.0.0.1
quarkus.http.limits.max-body-size=16K
quarkus.http.header."Cache-Control".value=no-store
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."Content-Security-Policy".value=default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'
quarkus.jackson.fail-on-unknown-properties=true
advent.year=2026
