name: Monorepo Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_all:
        description: 'Build all Maven projects (false refreshes only the catalog)'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  # The latest arduino/setup-protoc release still declares Node 20.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has-changes: ${{ steps.matrix.outputs.has-changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-catalog
      - name: Test and validate catalog tooling
        run: |
          jbang .github/scripts/VerifyCatalog.java
          jbang .github/scripts/ProjectCatalog.java validate
      - name: Discover companions and select existing Maven builds
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          BUILD_ALL: ${{ inputs.build_all }}
        run: |
          jbang .github/scripts/ProjectCatalog.java discover --output plan/catalog.json
          jbang .github/scripts/ProjectCatalog.java matrix \
            --event "$EVENT_NAME" --base "$BASE_SHA" --head "$GITHUB_SHA" \
            --build-all "$BUILD_ALL" --output plan/matrix.json --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog-plan
          path: plan/*.json
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    name: ${{ matrix.project.path }} (JDK ${{ matrix.project.java }})
    env:
      PROJECT_PATH: ${{ matrix.project.path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: ${{ matrix.project.java }}
          distribution: temurin
      - name: Install Protoc
        if: matrix.project.protoc == true
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache Maven dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-${{ runner.arch }}-maven-jdk${{ matrix.project.java }}-${{ matrix.project.path }}-${{ hashFiles(format('{0}/**/pom.xml', matrix.project.path), format('{0}/**/.mvn/**', matrix.project.path)) }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-maven-jdk${{ matrix.project.java }}-${{ matrix.project.path }}-
      - name: Build with Maven
        id: build
        working-directory: ${{ matrix.project.path }}
        continue-on-error: true
        run: |
          if [[ -f mvnw ]]; then chmod +x mvnw; command=(./mvnw); else command=(mvn); fi
          "${command[@]}" --batch-mode --no-transfer-progress package -DskipTests=false
      - name: Collect build outcome and module reports
        if: ${{ !cancelled() }}
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PRIOR_STATUS: ${{ job.status }}
        run: |
          result_dir="$RUNNER_TEMP/companion-result"
          mkdir -p "$result_dir/reports"
          status=failing
          if [[ "$BUILD_OUTCOME" == success && "$PRIOR_STATUS" == success ]]; then status=passing; fi
          printf '%s\n' "project=$PROJECT_PATH" "sourceSha=$GITHUB_SHA" \
            "runNumber=$GITHUB_RUN_NUMBER" "runAttempt=$GITHUB_RUN_ATTEMPT" \
            "status=$status" "reason=build:$BUILD_OUTCOME setup:$PRIOR_STATUS" > "$result_dir/status.properties"
          if [[ -d "$PROJECT_PATH" ]]; then
            while IFS= read -r -d '' report; do
              cp --parents -- "$report" "$result_dir/reports/"
            done < <(find "$PROJECT_PATH" -type f -path '*/target/surefire-reports/TEST-*.xml' -print0)
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: result-${{ matrix.project.path }}
          path: ${{ runner.temp }}/companion-result/
          overwrite: true
          if-no-files-found: error
          retention-days: 7
      - name: Preserve build failure
        if: ${{ !cancelled() && steps.build.outcome != 'success' }}
        run: exit 1

  preview:
    needs: [detect-changes, build]
    if: ${{ !cancelled() && needs.detect-changes.result == 'success' && (github.event_name == 'pull_request' || github.ref != 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: badges
          path: badges-branch
          persist-credentials: false
      - uses: ./.github/actions/setup-catalog
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: catalog-plan
          path: plan
      - name: Download available build results
        if: needs.detect-changes.outputs.has-changes == 'true'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: result-*
          path: results
      - name: Generate preview
        run: |
          jbang .github/scripts/ProjectCatalog.java aggregate --matrix plan/matrix.json \
            --results results --badges badges-branch --source-sha "$GITHUB_SHA" \
            --run-number "$GITHUB_RUN_NUMBER" --run-attempt "$GITHUB_RUN_ATTEMPT"
          jbang .github/scripts/ProjectCatalog.java render --badges badges-branch \
            --repository "$GITHUB_REPOSITORY" --output preview/README.md
          echo 'The generated README is available in the companion-catalog-preview artifact. No branches were updated.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: companion-catalog-preview
          path: preview/README.md
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [detect-changes, build]
    if: ${{ !cancelled() && needs.detect-changes.result == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: companion-publication
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-catalog
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: main-repo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: badges
          path: badges-branch
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: catalog-plan
          path: plan
      - name: Download available build results
        if: needs.detect-changes.outputs.has-changes == 'true'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: result-*
          path: results
      - name: Publish badges and regenerate README
        run: bash .github/scripts/publish-catalog.sh
