[extend]
  useDefault = true

[allowlist]
  description = "Global Allowlist"

  # Ignore based on any subset of the file path
  paths = [
    # Locally generated Wazuh development keys/certificates; also excluded from Git.
    '''(?:^|/)quarkus-wazuh-siem/infra/wazuh/config/wazuh_indexer_ssl_certs/[^/]+\.(?:pem|key)$''',
    # Ignore all example certs
    '''(?:^|\/)jwt-case.*\.pem$''',
    '''(?:^|\/)stateless-api.*\.pem$''',
    '''(?:^|\/)granular-rbac-tutorial.*\.pem$''',
    '''(?:^|\/)bsky-javafeed-generator2.*\.crt$''',
    '''(?:^|\/)bsky-javafeed-generator2.*\.key$''',
    '''(?:^|\/)enterprise-rag-secure\/.*\.pem$''',
    '''(?:^|\/)enterprise-rag-metadata\/.*\.pem$''',
    '''(?:^|\/)book-catalog\/.*\.pem$''',
    '''(?:^|\/)dpop-demo\/.*\.pem$''',
    '''(?:^|\/)magic-link-demo\/.*\.pem$''',
    '''(?:^|/)src/main/resources/certs/.*''',
    '''(?:^|/)src/main/resources/META-INF/resources/.*''',
    '''(?:^|/)quarkus-multi-tenant-extension\/.*\.pem$''',
    '''(?:^|/)agent-memory-storage/demo/test/.*\.py$'''
    ]

# The upstream Wazuh dashboard uses this public password in the local demo.
# Match both the exact file and password value; other credentials remain scanned.
[[rules]]
  id = "generic-api-key"

  [[rules.allowlists]]
    description = "Upstream Wazuh dashboard demo password"
    condition = "AND"
    paths = ['''(?:^|/)quarkus-wazuh-siem/infra/wazuh/config/wazuh_dashboard/wazuh\.yml$''']
    regexTarget = "secret"
    regexes = ['''^MyS3cr37P450r\.\*-$''']
