quarkus.datasource."tenant-a".db-kind=db2
quarkus.datasource."tenant-a".username=tena
quarkus.datasource."tenant-a".password=${DB2_A_PASSWORD}
quarkus.datasource."tenant-a".jdbc.url=${DB2_JDBC_URL:jdbc:db2://localhost:50000/RCACLAB}
quarkus.datasource."tenant-a".jdbc.initial-size=1
quarkus.datasource."tenant-a".jdbc.min-size=1
quarkus.datasource."tenant-a".jdbc.max-size=1
quarkus.datasource."tenant-a".jdbc.acquisition-timeout=10S
quarkus.datasource."tenant-a".devservices.enabled=false

