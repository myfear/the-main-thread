# Local tutorial authentication. Passwords are supplied by scripts/app.sh.
quarkus.http.host=127.0.0.1
quarkus.http.auth.basic=true
quarkus.security.users.embedded.enabled=true
quarkus.security.users.embedded.plain-text=true
quarkus.security.users.embedded.users.alice=${HTTP_ALICE_PASSWORD}
quarkus.security.users.embedded.users.bob=${HTTP_BOB_PASSWORD}
quarkus.security.users.embedded.users.auditor=${HTTP_AUDITOR_PASSWORD}
quarkus.security.users.embedded.users.unmapped=${HTTP_UNMAPPED_PASSWORD}
quarkus.security.users.embedded.roles.alice=directory
quarkus.security.users.embedded.roles.bob=directory
quarkus.security.users.embedded.roles.auditor=directory
quarkus.security.users.embedded.roles.unmapped=directory
