quarkus.application.name=checkout-outbox-replicas

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=12

%dev,test.quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.4-alpine3.24
%dev,test.quarkus.datasource.devservices.db-name=checkout
%dev,test.quarkus.datasource.devservices.username=checkout
%dev,test.quarkus.datasource.devservices.password=checkout

quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.log.sql=false

mp.messaging.outgoing.order-placed.connector=smallrye-kafka
mp.messaging.outgoing.order-placed.topic=order-placed
mp.messaging.outgoing.order-placed.cloud-events=false
mp.messaging.outgoing.order-placed.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.order-placed.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

mp.messaging.incoming.fulfillment.connector=smallrye-kafka
mp.messaging.incoming.fulfillment.topic=order-placed
mp.messaging.incoming.fulfillment.cloud-events=false
mp.messaging.incoming.fulfillment.auto.offset.reset=earliest
mp.messaging.incoming.fulfillment.group.id=checkout-fulfillment
mp.messaging.incoming.fulfillment.value.deserializer=com.themainthread.checkout.OrderPlacedDeserializer

checkout.outbox.poll-every=1s
checkout.outbox.batch-size=1
checkout.outbox.lease-duration=30s
checkout.demo.enabled=false
checkout.crash.halt=true

# Bound broker stalls; lease expiry can still overlap a slow or paused sender.
mp.messaging.outgoing.order-placed.acks=all
mp.messaging.outgoing.order-placed.waitForWriteCompletion=true
mp.messaging.outgoing.order-placed.delivery.timeout.ms=20000
mp.messaging.outgoing.order-placed.request.timeout.ms=10000
mp.messaging.outgoing.order-placed.max.block.ms=5000

# Host-launched JVMs share explicitly managed infrastructure in this profile.
%demo.quarkus.devservices.enabled=false
%demo.quarkus.http.host=127.0.0.1
%demo.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:15432/checkout
%demo.quarkus.datasource.username=checkout
%demo.quarkus.datasource.password=checkout
%demo.kafka.bootstrap.servers=localhost:19092
%demo.checkout.demo.enabled=true
# Make consumer-group recovery visible during the local JVM-kill demo.
%demo.mp.messaging.incoming.fulfillment.session.timeout.ms=6000
%demo.mp.messaging.incoming.fulfillment.heartbeat.interval.ms=2000

# Tests drive the publisher themselves so crash-window assertions stay deterministic.
%test.quarkus.scheduler.enabled=false
%test.checkout.crash.halt=false
%test.checkout.demo.enabled=true
%test.checkout.outbox.batch-size=20

# Keep tests isolated even when local development enables container reuse.
%test.quarkus.datasource.devservices.reuse=false
%dev,test.quarkus.kafka.devservices.shared=false
%dev,test.quarkus.kafka.devservices.image-name=docker.io/apache/kafka-native:4.2.0
# The process demo owns Compose; tests keep using isolated Dev Services.
quarkus.compose.devservices.enabled=false
