quarkus.aesh.mode=console
quarkus.aesh.prompt=[swiftship]$ 
quarkus.aesh.start-console=false
quarkus.aesh.add-exit-command=true
quarkus.aesh.persist-history=false

quarkus.aesh.websocket.roles-allowed=operator
quarkus.aesh.websocket.max-connections=4
quarkus.aesh.websocket.idle-timeout=15m

quarkus.aesh.ssh.host=127.0.0.1
quarkus.aesh.ssh.port=2222
quarkus.aesh.ssh.authorized-keys-file=${SSH_AUTHORIZED_KEYS_FILE:target/aesh/authorized_keys}
quarkus.aesh.ssh.host-key-file=${SSH_HOST_KEY_FILE:target/aesh/host-key.ser}
quarkus.aesh.ssh.max-connections=4
quarkus.aesh.ssh.idle-timeout=15m

quarkus.http.auth.basic=true
quarkus.http.auth.realm=SwiftShip Operations
quarkus.http.auth.policy.operator.roles-allowed=operator
quarkus.http.auth.permission.aesh.paths=/aesh/*
quarkus.http.auth.permission.aesh.policy=operator

%dev.quarkus.security.users.embedded.enabled=true
%dev.quarkus.security.users.embedded.plain-text=true
%dev.quarkus.security.users.embedded.users.operator=terminal
%dev.quarkus.security.users.embedded.roles.operator=operator
%dev.quarkus.security.users.embedded.users.viewer=terminal
%dev.quarkus.security.users.embedded.roles.viewer=viewer

%test.quarkus.security.users.embedded.enabled=true
%test.quarkus.security.users.embedded.plain-text=true
%test.quarkus.security.users.embedded.users.operator=terminal
%test.quarkus.security.users.embedded.roles.operator=operator
%test.quarkus.security.users.embedded.users.viewer=terminal
%test.quarkus.security.users.embedded.roles.viewer=viewer
%test.quarkus.aesh.ssh.enabled=false
%test.quarkus.aesh.start-console=true
